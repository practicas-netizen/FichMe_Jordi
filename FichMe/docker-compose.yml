services:
  db:
    image: postgres:17
    container_name: fichme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en el .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en el .env}
      TZ: Europe/Madrid
    ports:
      # Solo accesible desde tu propio ordenador, no desde la red
      - "127.0.0.1:5432:5432"
    volumes:
      # Aquí se guardan los datos. Sin esto se perderían al borrar el contenedor
      - fichme_data:/var/lib/postgresql/data
      # Los .sql de esta carpeta se ejecutan solo la primera vez (con la base vacía)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web para ver y editar las tablas: http://localhost:8080
  adminer:
    image: adminer
    container_name: fichme-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fichme_data: